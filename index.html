<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<!-- Both themes are real, so the webview must not assume either one. -->
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<title>Archive</title>

<!-- ═══ homescreen ══════════════════════════════════════════════════════════
     What turns the URL into an app, and it is now the ONLY thing that does.
     The archive shipped as a native iOS build for a while; this block is what
     replaced it. Everything here is load-bearing — nothing below is legacy or
     belt-and-braces.

     Safari reads the apple-* metas. The manifest is what macOS Safari's "Add
     to Dock" and every other browser read. Both are here because the archive
     is opened from a phone homescreen and a Mac dock, and neither format
     covers both.

     STATUS BAR STYLE IS `black-translucent`, AND IT WAS `default`. This is the
     one setting in the app that buys something real and charges something
     real, so the trade is written down rather than rediscovered.

     WHAT IT BUYS: the status bar stops being a bar. `default` reserves a strip
     at the top of the screen, fills it with the theme-color, and starts the
     web content underneath it — so the archive was a page inside a frame, at
     both ends, and the bottom end has now given up its reserved strip too (see
     .composer in app.css). Translucent hands the whole pane of glass to the
     app and draws the clock and the battery straight over it. A photograph
     opened in the lightbox reaches the top of the phone. Nothing in the layout
     collides with the clock, because .view--bare already pays
     env(safe-area-inset-top) for exactly this.

     WHAT IT COSTS: the status bar glyphs are WHITE, permanently and
     unconditionally. There is no light variant of this setting and no media
     query reaches it. On a dark page — black, Newsprint dark, deep Bondi —
     that is correct. On a LIGHT page it is white on cream, white on ice, and
     white on lime, which is a clock you can see the shape of and not read.
     That is half the palettes half the day, and it is a deliberate choice made
     with the cost known: the archive gains a full screen and loses a legible
     clock in daylight. Changing this one word back to `default` reverses both
     halves of that and nothing else in the app needs to move.

     NOTE THAT THIS META DOES NOTHING IN SAFARI ITSELF. It applies only once
     the URL is on the homescreen. In a Safari tab the top and bottom bars are
     Safari's own chrome; the page's only influence over them is the
     theme-color metas above, which the palette already keeps identical to the
     page colour, so they are as close to invisible as a page can make them. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Archive">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">

<!-- The archive is reachable by URL, which is not the same as wanting it
     found. Nothing here should ever turn up in a search result. -->
<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">

<!-- ═══ the surface, before the first paint ═════════════════════════════════
     Which of the two surfaces is showing is one attribute on <html>, and this
     is what sets it. See the Surface blocks in tokens.css for why it is an
     attribute and not a media query — in short, a custom palette can put dark
     ink on a light ground the phone knows nothing about, so the question is
     "is the page the lighter of the two colours", which only the app can
     answer.

     IT RUNS HERE, BLOCKING, AND THAT IS THE POINT. The whole app is one solid
     colour edge to edge. A frame of black before a cream palette arrives isn't
     a flicker, it's the screen changing colour in your hand — so this cannot
     wait for the module graph, and it is the one place outside platform.js
     that touches localStorage. It gets away with it by doing no thinking: the
     stored palette carries a finished style string FOR EACH MODE, both written
     by js/palette.js, which recomputes and rewrites them on every boot. All
     that happens here is picking one of the two. There is no second copy of
     the derivation to drift out of step with the first — there is no
     derivation here at all.

     The two theme-color metas are scoped by colour-scheme and are what tints
     the browser UI around a tab. Under a palette neither scope is right, so
     both are unscoped and set to that mode's page colour; whichever the engine
     picks then gives the same answer.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  var root = document.documentElement, p = null;
  var mode = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  root.setAttribute('data-page', mode);
  try { p = JSON.parse(localStorage.getItem('archive.palette') || 'null'); } catch (e) {}
  if (!p || !p.css || !p.css[mode]) return;
  root.style.cssText = p.css[mode];
  var metas = document.querySelectorAll('meta[name="theme-color"]');
  for (var i = 0; i < metas.length; i++) {
    metas[i].removeAttribute('media');
    metas[i].setAttribute('content', p[mode]);
  }
})();
</script>
</head>
<body>

<!-- ═══ icon set ════════════════════════════════════════════════════════════
     One sprite, geometric, hairline stroke, no fills, no rounded joins. Eight
     drawings, and every one of them is a VERB or a thing you do: five in the
     composer row, one on an outbound link, two of the editor's marks.

     THE FIVE FOLDERS USED TO BE IN HERE TOO — a heel, a frame, an open book, a
     margin rule, a pencil — because the ＋ opened a dial of round buttons with
     no room for a word in them, and the tree set the same marks beside its own
     words. Both menus are lists of names now, so both say "Library" where they
     used to draw one, and five careful little pictures of five words that were
     already on the screen went with them. A drawing earns its place here by
     standing for something that has no word short enough to print.

     ONE INK. Every stroke in every drawing here is at full strength. Half of
     them used to be set at 50% to say which part of a drawing was structural
     and which was detail, and at 16px that is not a hierarchy, it is a mark
     drawn in two colours: the faint parts read as a rendering fault rather
     than as subordinate. What a drawing is OF does the work these opacities
     were doing. Nothing in this sprite carries an opacity.
     ══════════════════════════════════════════════════════════════════════ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <!-- The one control that is on nearly every screen. It opens a card, so it
       has no second state to draw: the row it lives in slides away while the
       card is up, and the card is dismissed by the scrim, a swipe, or picking
       something. -->
  <symbol id="ic-plus" viewBox="0 0 16 16">
    <path d="M8 3.25v9.5M3.25 8h9.5" fill="none" stroke="currentColor"
          stroke-width="1" stroke-linecap="square"/>
  </symbol>

  <symbol id="ic-search" viewBox="0 0 16 16">
    <circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1"/>
    <path d="M10.4 10.4L14 14" fill="none" stroke="currentColor"
          stroke-width="1.25" stroke-linecap="square"/>
  </symbol>

  <symbol id="ic-back" viewBox="0 0 16 16">
    <path d="M10 3.5L5.5 8l4.5 4.5" fill="none" stroke="currentColor"
          stroke-width="1.25" stroke-linecap="square"/>
  </symbol>

  <symbol id="ic-link" viewBox="0 0 16 16">
    <path d="M6.5 3.5H13v6.5" fill="none" stroke="currentColor" stroke-width="1"/>
    <path d="M13 3.5L6 10.5" fill="none" stroke="currentColor" stroke-width="1"/>
    <path d="M11 13H3V5" fill="none" stroke="currentColor" stroke-width="1"/>
  </symbol>

  <symbol id="ic-trash" viewBox="0 0 16 16">
    <path d="M3.5 4.5h9M6 4.5V3h4v1.5M4.5 4.5l.7 9h5.6l.7-9"
          fill="none" stroke="currentColor" stroke-width="1"/>
    <path d="M6.8 7v4M9.2 7v4" fill="none" stroke="currentColor" stroke-width="1"/>
  </symbol>

  <!-- Everything you can do to the thing you're reading, before you've asked
       what that is. It is the only mark in the sprite that is not a picture of
       its verb, because it doesn't have one: it stands for three of them, and
       the card it opens says which in words. The dots are the same round caps
       the list's bullets are drawn with — nothing else here is a dot, so at
       16px it can't be mistaken for any other mark in the row. -->
  <symbol id="ic-more" viewBox="0 0 16 16">
    <path d="M3.5 8h.01M8 8h.01M12.5 8h.01" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round"/>
  </symbol>

  <!-- THE ONLY FILL IN THE SPRITE, and it is the exception that states the
       rule. Every other drawing here is a hairline outline because it stands
       for a verb, and a verb has a shape rather than a colour. This one stands
       for the two colours themselves — so a hollow drawing of it would be a
       picture of a palette with the palette left out.

       It draws itself in whatever palette is live: the filled half is
       currentColor, the empty half is the pill it sits in, which is the page.
       So the button in the corner of the home screen is always a sample of the
       archive you are looking at, and it changes when you change it. -->
  <symbol id="ic-palette" viewBox="0 0 16 16">
    <circle cx="8" cy="8" r="5.5" fill="none" stroke="currentColor" stroke-width="1"/>
    <path d="M8 2.5a5.5 5.5 0 0 0 0 11z" fill="currentColor"/>
  </symbol>

  <!-- ── The marks ─────────────────────────────────────────────────────────
       Two of the editor's six. Four of them are letters set in the style they
       make — a bold B, an italic I, an oversized H, a large “ — and a
       letter that IS its own result needs no drawing. These two make a SHAPE
       on the page instead, so they get one: a small picture of what the
       paragraph is about to become. Same hairline, same grid, one ink. -->

  <!-- A list. The bullets are round dots and the text is straight lines, which
       is the difference the drawing turns on — nothing here needs a second
       opacity to say which of the two is the point. -->
  <symbol id="ic-list" viewBox="0 0 16 16">
    <path d="M2.5 4h.01M2.5 8h.01M2.5 12h.01" fill="none" stroke="currentColor"
          stroke-width="1.5" stroke-linecap="round"/>
    <path d="M6 4h7.5M6 8h7.5M6 12h5" fill="none" stroke="currentColor"
          stroke-width="1"/>
  </symbol>

  <!-- ONE BOX, TICKED, and it is the whole square. The obvious drawing was the
       icon above with boxes for bullets — a checklist is a list, after all —
       and at 20px that is three 6px boxes with a tick in one of them, which is
       four drawings' worth of line in the space of one and reads as a smudge.

       So this one gives up saying "list" (the icon beside it already does) and
       says "checked" at a size where the tick is legible. It's the same box
       and the same tick .prose draws on a done item, which is the object the
       button actually makes. -->
  <symbol id="ic-check" viewBox="0 0 16 16">
    <rect x="3" y="3" width="10" height="10" rx="1.5" fill="none"
          stroke="currentColor" stroke-width="1"/>
    <path d="M5.5 8.1l1.9 1.9 3.5-4" fill="none" stroke="currentColor"
          stroke-width="1" stroke-linecap="square"/>
  </symbol>

</svg>

<!-- ═══ app ═══════════════════════════════════════════════════════════════ -->

<div id="view" class="view" role="main"></div>

<!-- The bottom bar is not navigation, and it is not five bars pretending to be
     one. It's a single row that changes shape: no screen in the app has a
     header, so everything a header would have carried comes down here and
     widens in from nothing when the screen you're on has use for it.

     THE ROW HAS TWO ENDS AND THEY MEAN DIFFERENT THINGS.

       LEFT is leaving, and only leaving. Back sits where the swipe-back
       gesture starts, so the gesture and the button are the same idea in the
       same corner and one is just the slower way to do the other.

       RIGHT is where the phone is actually held. A right thumb pivots at the
       bottom right corner and sweeps a quarter circle up and to the left, so
       the thing you reach for from anywhere — the ＋, or the ⋯ that stands in
       for it on a page — lives at the bottom of that sweep, and so does the
       card either one opens: it rises from the bottom edge right where the
       button was.

     FOUR BUTTONS BECAME TWO. A screen showing one piece of writing used to
     stand back at one edge and edit, delete, ⌕ and ＋ at the other, under
     something you were trying to read, most of them about administering the
     piece rather than reading it. The three that belong to the piece are rows
     in the card the ⋯ opens now — named in words, which is what a rare verb
     wants — and the ⌕ is gone from every screen but the two that search. See
     entries.js and dressComposer in app.js.

     What's left in the row besides back and the corner is the delete pill,
     which widens in for the lightbox alone: a full-screen photograph has
     nowhere to put a card and nothing else you can do to it.

     Every button is in the DOM at all times — collapsing to zero width is what
     makes it a morph; rebuilding the row would make it a replacement. What a
     screen doesn't need closes up rather than leaving a hole, and the two ends
     collapse toward their own edge so neither group ever drifts inward.

     The wide slot in the middle holds one of two things, or nothing:

       THE SEARCH FIELD, on the two screens that are about searching — the
       contents page, where there's nothing else to do, and the results, which
       are a rendering of what's in it. Nowhere else, and there is no ⌕ button
       leading here from anywhere else either: a keyboard-sized target sat
       under every essay in the archive advertising a thing you weren't doing,
       and replacing it with an icon that opened it was the same offer in less
       ink. Searching starts on the contents page, which is one back-swipe from
       everywhere and is already where you go to look for something.

       THE MAIN ACTION, on the screens that have one — Publish in the editor.
       That screen is doing one thing and search isn't it.

     THE LEFT EDGE HAS A SECOND TENANT NOW, and only on one screen. Left is
     leaving, and the home screen is the one place in the app there is nothing
     to leave — so the slot back would occupy is empty there, permanently, and
     the palette takes it. It is not a compromise with the rule; it is the one
     screen the rule has nothing to say about. On every other screen the
     palette button is collapsed to zero and back is where it has always been,
     so the two never share the row and the corner never moves.

     Why there and not in the ＋ card: the palette is the one control in the
     app whose effect you judge by looking at the screen behind it. A row in a
     menu two taps deep is where you put something you use once; this is
     something you sit and turn until the archive looks right. -->
<div class="composer" id="composer">
  <button class="composer__morph" id="composer-palette" type="button"
          aria-label="Palette" aria-haspopup="true">
    <svg class="ic"><use href="#ic-palette"></use></svg>
  </button>
  <button class="composer__morph" id="composer-back" type="button" aria-label="Back">
    <svg class="ic"><use href="#ic-back"></use></svg>
  </button>
  <button class="composer__morph" id="composer-trash" type="button" aria-label="Delete">
    <svg class="ic"><use href="#ic-trash"></use></svg>
  </button>

  <div class="composer__slot">
    <label class="composer__search" id="composer-search-shell">
      <svg class="ic composer__search-ic"><use href="#ic-search"></use></svg>
      <input class="composer__field" id="composer-search" type="search"
             placeholder="Search" aria-label="Search the archive"
             autocomplete="off" autocorrect="off" autocapitalize="none"
             spellcheck="false" enterkeyhint="search">
    </label>
    <button class="composer__main" id="composer-main" type="button">Publish</button>
  </div>

  <!-- The corner. Exactly one of these two is ever on at a time and they land
       on the same spot: the ＋ where you can add to the archive, the ⋯ where
       you're looking at one thing and the verbs belong to it. The thumb learns
       one position and finds whichever of them the screen has — and both open
       the same object, a card at the bottom of the screen listing words. -->
  <button class="composer__morph composer__morph--right"
          id="composer-add" type="button" aria-label="Add"
          aria-haspopup="true">
    <svg class="ic"><use href="#ic-plus"></use></svg>
  </button>
  <button class="composer__morph composer__morph--right"
          id="composer-more" type="button" aria-label="Actions"
          aria-haspopup="true">
    <svg class="ic"><use href="#ic-more"></use></svg>
  </button>
</div>

<!-- Above everything, always. -->
<div class="grain" aria-hidden="true"></div>

<script type="module" src="js/app.js"></script>

<!-- The offline copy. This is what makes the homescreen icon an app rather than
     a bookmark that fails on the underground — there is no bundled build to
     fall back on any more, so sw.js is the only reason the archive opens
     without a network. See sw.js for which files are cached which way.

     Guarded on http(s) so that opening index.html straight off disk — a
     file:// URL, which throws on register() — still works for a quick look. -->
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    /* Whether this page was ALREADY under a worker when it started. It is the
       difference between "a new version just took over" and "a worker took
       over for the very first time" — clients.claim() in sw.js fires the same
       event for both, and reloading on the second one would reload every first
       visit for nothing. */
    var HAD_CONTROLLER = !!navigator.serviceWorker.controller;
    var reloading = false;
    var reg = null;

    addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js')
        .then(function (r) { reg = r; })
        .catch(function () {});
    });

    /* A HOMESCREEN APP IS NOT RELOADED, IT IS RESUMED. This is the whole
       problem this block exists to solve. Tapping the icon after a deploy
       usually resumes the suspended app off the app switcher — no navigation,
       no fetch, no new worker, and the archive sits on last week's code
       looking exactly like it did when you put the phone down. sw.js being
       network-first is what makes a deploy LANDABLE; this is what makes it
       actually land.

       So: every time the app comes back to the front, ask whether there is a
       newer worker. If there is, sw.js skipWaiting()s straight past the usual
       wait-for-all-tabs-to-close dance, claims this page, and controllerchange
       below turns that into a reload.

       Reloading is safe HERE and only here, and it is not luck — the editor
       flushes on visibilitychange 'hidden' (see the end of editor.js), so by
       the time the app has been backgrounded there is nothing unsaved left to
       lose. A version check on a timer, while you were typing, would not have
       that guarantee. */
    addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && reg) reg.update();
    });

    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!HAD_CONTROLLER || reloading) return;
      reloading = true;
      location.reload();
    });
  }
</script>

<!-- WHAT THIS STILL CANNOT UPDATE, and it is worth knowing rather than
     rediscovering. Everything above keeps the CODE current: the CSS, the
     modules, the seed index, on the next launch, without a dance.

     The LAUNCH CHROME is a different thing and none of it is ours. The status
     bar style, the icon, the app's name and the standalone display mode are
     read by iOS when you tap Add to Home Screen and are baked into the
     shortcut at that moment. A deploy does not revisit them. So changing
     apple-mobile-web-app-status-bar-style — which is exactly what makes the
     status bar and the home-indicator bands stop being reserved strips — has
     no effect at all on a shortcut created before the change. The fix is to
     delete the icon and add it again, once. There is no way to trigger it from
     inside the page. -->
</body>
</html>
